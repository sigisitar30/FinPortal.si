name: Refresh BS macro data

# Site is GitHub Pages (auto-builds on push to main), so committing fresh
# data here is the whole deploy — no separate build/upload step needed.

on:
  schedule:
    # 05:10 UTC daily — after Bank of Slovenia's own publication window.
    - cron: '10 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-macro
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run BS macro scraper
        run: python "Podatki bank/scrapers/BS_MFI_OBR_MERE_i2_4_6as_scraper.py"

      - name: Commit and push if data changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Podatki makro"
          if git diff --cached --quiet; then
            echo "No data changes, nothing to commit."
            exit 0
          fi
          period=$(node -pe "JSON.parse(require('fs').readFileSync('Podatki makro/BS/bs_mfi_obrestne_mere_posojila_latest.json')).period" 2>/dev/null || echo "")
          git commit -m "data(makro): refresh BS MFI interest rates${period:+ to $period}"
          git push
